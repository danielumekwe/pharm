<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>PharmaERP – offline</title>
    <style>
      :root { color-scheme: light; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f1f5f9; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #0f172a; }
      main { width: min(92vw, 380px); background: #fff; border-radius: 20px; padding: 32px 24px; text-align: center; box-shadow: 0 20px 50px -25px rgba(15, 23, 42, .35); }
      img { width: 88px; height: 88px; }
      h1 { font-size: 20px; margin: 16px 0 6px; }
      p { color: #475569; font-size: 15px; line-height: 1.5; margin: 0 0 22px; }
      button { width: 100%; border: 0; border-radius: 12px; background: #2563eb; color: #fff; font-size: 16px; font-weight: 700; padding: 14px; }
      small { display: block; margin-top: 14px; color: #94a3b8; }
    </style>
  </head>
  <body>
    <main>
      <img src="icon.png" alt="PharmaERP" />
      <h1>You're offline</h1>
      <p>PharmaERP needs an internet connection to load sales and stock. Check Wi-Fi or mobile data, then try again.</p>
      <button type="button" onclick="location.replace('https://pharmacy-erp-demo.vercel.app/dashboard')">Try again</button>
      <small>Nothing has been lost: sales are only saved once the server confirms them.</small>
    </main>
    <script>
      window.addEventListener("online", function () { location.replace("https://pharmacy-erp-demo.vercel.app/dashboard"); });
    </script>
  </body>
</html>
